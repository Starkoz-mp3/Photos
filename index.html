<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stan Kozik – Photographs</title>
<style>
  :root { --bg:#f2f3f1; --ink:#1d2326; --mute:#6b7478; --veil:rgba(20,26,29,.94); color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c2226; --ink:#e8ecec; --mute:#8d989c; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  header { padding:clamp(2rem,8vw,5rem) clamp(1rem,4vw,3rem) 1.5rem; }
  h1 { margin:0; font:400 clamp(2.4rem,9vw,5.5rem)/1 "Iowan Old Style","Palatino Linotype",Georgia,serif; letter-spacing:-.02em; }
  header p { margin:.75rem 0 0; color:var(--mute); }
  main { padding:0 clamp(1rem,4vw,3rem) 4rem; }
  /* Rows of photos fill the full width; each photo keeps its own shape. --h is the target row height. */
  .gallery { --h:300px; display:flex; flex-wrap:wrap; gap:10px; }
  .gallery::after { content:""; flex-grow:1000000; }
  .gallery button { --r:1.5; flex:calc(var(--r) * 100) 1 calc(var(--r) * var(--h)); margin:0; padding:0; border:0; background:none; cursor:zoom-in; }
  .gallery img { display:block; width:100%; height:auto; background:rgba(128,128,128,.15); }
  @media (max-width:600px) { .gallery { --h:180px; gap:6px; } }
  button:focus-visible { outline:3px solid currentColor; outline-offset:2px; }
  .msg { color:var(--mute); max-width:60ch; }
  #box { position:fixed; inset:0; background:var(--veil); display:none; align-items:center; justify-content:center; flex-direction:column; padding:3rem 1rem 4rem; color:#e8ecec; z-index:10; }
  #box.open { display:flex; }
  #box img { max-width:100%; max-height:100%; object-fit:contain; min-height:0; }
  #cap { position:absolute; bottom:1.25rem; left:0; right:0; text-align:center; font-size:.95rem; color:#aab3b6; }
  #box .nav { position:absolute; top:50%; transform:translateY(-50%); border:0; background:none; color:inherit; font-size:2.5rem; padding:1rem; cursor:pointer; }
  #prev { left:0; } #next { right:0; }
  #close { position:absolute; top:.5rem; right:.75rem; border:0; background:none; color:inherit; font-size:2rem; padding:.5rem 1rem; cursor:pointer; }
</style>
</head>
<body>
<header>
  <h1>Stan Kozik</h1>
  <p>Photographs</p>
</header>
<main><div id="gallery" class="gallery"></div></main>

<div id="box" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button id="close" aria-label="Close">×</button>
  <button id="prev" class="nav" aria-label="Previous photo">‹</button>
  <img id="big" alt="">
  <button id="next" class="nav" aria-label="Next photo">›</button>
  <div id="cap"></div>
</div>

<script>
// GitHub username/repo that holds this site.
const REPO = "Starkoz-mp3/Photos";
const FOLDER = "images";

const gal = document.getElementById("gallery");
const box = document.getElementById("box"), big = document.getElementById("big"), cap = document.getElementById("cap");
let photos = [], i = 0, opener = null;

const nice = f => f.replace(/\.[^.]+$/, "").replace(/^[\d\s_-]+/, "").replace(/[-_]+/g, " ").trim();

fetch(`https://api.github.com/repos/${REPO}/contents/${FOLDER}`)
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(list => {
    photos = list.filter(f => /\.(jpe?g|png|webp|avif|gif)$/i.test(f.name))
      .map(f => f.name).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
    if (!photos.length) { gal.innerHTML = '<p class="msg">No photos yet. Add some to the images folder.</p>'; return; }
    photos.forEach((name, n) => {
      const b = document.createElement("button");
      b.setAttribute("aria-label", "Open photo " + (nice(name) || n + 1));
      b.innerHTML = `<img src="${FOLDER}/${encodeURIComponent(name)}" decoding="async" alt="${nice(name)}">`;
      const im = b.firstChild;
      const setShape = () => { if (im.naturalHeight) b.style.setProperty("--r", im.naturalWidth / im.naturalHeight); };
      im.onload = setShape;
      if (im.complete) setShape();
      b.onclick = () => show(n, b);
      gal.appendChild(b);
    });
  })
  .catch(() => { gal.innerHTML = '<p class="msg">Couldn’t load the photo list. Check that REPO at the top of index.html matches your GitHub username and repo name, and that the repo is public.</p>'; });

function show(n, from) {
  i = (n + photos.length) % photos.length;
  if (from) opener = from;
  big.src = `${FOLDER}/${encodeURIComponent(photos[i])}`;
  big.alt = nice(photos[i]);
  cap.textContent = nice(photos[i]);
  box.classList.add("open");
  document.getElementById("close").focus();
}
function hide() { box.classList.remove("open"); big.removeAttribute("src"); if (opener) opener.focus(); }

document.getElementById("close").onclick = hide;
document.getElementById("prev").onclick = () => show(i - 1);
document.getElementById("next").onclick = () => show(i + 1);
box.addEventListener("click", e => { if (e.target === box) hide(); });
document.addEventListener("keydown", e => {
  if (!box.classList.contains("open")) return;
  if (e.key === "Escape") hide();
  if (e.key === "ArrowLeft") show(i - 1);
  if (e.key === "ArrowRight") show(i + 1);
});
let x0 = null;
box.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, { passive: true });
box.addEventListener("touchend", e => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0; x0 = null;
  if (Math.abs(dx) > 50) show(i + (dx < 0 ? 1 : -1));
});
</script>
</body>
</html>
